
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  .page {
    min-height: 100vh;
    background: #0f1923;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    font-family: var(--font-sans, Arial, sans-serif);
  }
  .split { display: flex; width: 100%; max-width: 900px; }
  .left {
    flex: 1.2;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem;
  }
  .right {
    flex: 1;
    background: #192734;
    border-radius: 0 20px 20px 0;
    padding: 2.5rem 2rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .logo-row { display: flex; align-items: center; gap: 10px; margin-bottom: 1.5rem; }
  .brand { font-size: 22px; font-weight: 500; color: #e7e9ea; }
  .badge { display: inline-block; background: #1da1f2; color: #fff; font-size: 10px; padding: 2px 7px; border-radius: 10px; margin-left: 6px; font-weight: 500; }
  .tagline { font-size: 13px; color: #8899a6; margin-bottom: 1.75rem; line-height: 1.5; }
  .tab-row { display: flex; background: #11202e; border-radius: 10px; padding: 4px; margin-bottom: 1.5rem; }
  .tab { flex: 1; padding: 8px; text-align: center; font-size: 13px; color: #8899a6; cursor: pointer; border-radius: 7px; border: none; background: transparent; transition: background 0.2s, color 0.2s; }
  .tab.active { background: #1da1f2; color: #fff; font-weight: 500; }
  .panel { display: none; }
  .panel.active { display: block; }
  .field { position: relative; margin-bottom: 14px; }
  .field label { display: block; font-size: 11px; color: #8899a6; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.6px; }
  .field input { width: 100%; padding: 11px 14px 11px 40px; background: #253341; border: 0.5px solid #38444d; border-radius: 8px; color: #e7e9ea; font-size: 14px; outline: none; transition: border-color 0.2s; }
  .field input:focus { border-color: #1da1f2; }
  .field input::placeholder { color: #566370; }
  .field .icon { position: absolute; left: 12px; bottom: 11px; width: 16px; height: 16px; opacity: 0.45; }
  .btn-primary { width: 100%; padding: 11px; background: #1da1f2; color: #fff; border: none; border-radius: 25px; font-size: 15px; font-weight: 500; cursor: pointer; margin-top: 4px; transition: background 0.2s, opacity 0.2s; }
  .btn-primary:hover { background: #1a91da; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-ghost { width: 100%; padding: 10px; background: transparent; color: #1da1f2; border: 0.5px solid #1da1f2; border-radius: 25px; font-size: 14px; cursor: pointer; transition: background 0.2s; margin-top: 4px; }
  .btn-ghost:hover { background: rgba(29,161,242,0.08); }
  .divider { display: flex; align-items: center; gap: 10px; margin: 14px 0; color: #566370; font-size: 12px; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 0.5px; background: #38444d; }
  .forgot { text-align: right; font-size: 12px; color: #1da1f2; cursor: pointer; margin-top: -8px; margin-bottom: 12px; }
  .strength-bar { display: flex; gap: 3px; margin-top: 6px; }
  .strength-seg { flex: 1; height: 3px; border-radius: 2px; background: #253341; transition: background 0.3s; }
  .toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); padding: 10px 20px; border-radius: 25px; font-size: 13px; font-weight: 500; color: #fff; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999; white-space: nowrap; }
  .toast.show { opacity: 1; }
  .toast.success { background: #1d9e75; }
  .toast.error { background: #e24b4a; }
  .footer-note { text-align: center; font-size: 12px; color: #566370; margin-top: 1.25rem; }
  .footer-note a { color: #1da1f2; text-decoration: none; }
  @media (max-width: 600px) {
    .split { flex-direction: column; max-width: 360px; }
    .left { padding: 2rem 1rem 0.5rem; }
    .right { border-radius: 0 0 20px 20px; }
  }
</style>

<div class="page">
  <div class="split">
    <div class="left">
      <svg width="160" height="160" viewBox="0 0 300 300" fill="none">
        <circle cx="150" cy="150" r="150" fill="#1da1f2" opacity="0.1"/>
        <path d="M230 95c-8 3.5-16.5 5.8-25.5 6.8 9.2-5.5 16.2-14.2 19.5-24.6-8.6 5.1-18.1 8.7-28.2 10.7-8.1-8.6-19.6-14-32.4-14-24.5 0-44.4 19.8-44.4 44.2 0 3.5.4 6.8 1.1 10-36.9-1.8-69.6-19.5-91.5-46.4-3.8 6.5-6 14.1-6 22.2 0 15.3 7.8 28.8 19.7 36.7-7.3-.2-14.1-2.2-20.1-5.5v.6c0 21.4 15.2 39.2 35.4 43.3-3.7 1-7.6 1.5-11.6 1.5-2.8 0-5.6-.3-8.3-.8 5.6 17.5 21.9 30.2 41.2 30.6-15.1 11.8-34.1 18.9-54.8 18.9-3.6 0-7.1-.2-10.5-.6 19.5 12.5 42.7 19.8 67.6 19.8 81.1 0 125.4-67.2 125.4-125.4 0-1.9 0-3.8-.1-5.7 8.6-6.2 16.1-14 22-22.8z" fill="#1da1f2"/>
        <circle cx="150" cy="150" r="140" stroke="#1da1f2" stroke-width="1" stroke-dasharray="8 6" opacity="0.2"/>
      </svg>
    </div>
    <div class="right">
      <div class="logo-row">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="#1da1f2"><path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z"/></svg>
        <span class="brand">Twitter</span>
        <span class="badge">Clone</span>
      </div>
      <p class="tagline">Happening now. Join the conversation.</p>

      <div class="tab-row">
        <button class="tab active" id="tab-login" onclick="switchTab('login')">Sign in</button>
        <button class="tab" id="tab-register" onclick="switchTab('register')">Create account</button>
      </div>

      <div id="panel-login" class="panel active">
        <div class="field">
          <label>Email address</label>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#8899a6" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,12 2,6"/></svg>
          <input id="login-email" type="email" placeholder="you@example.com">
        </div>
        <div class="field">
          <label>Password</label>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#8899a6" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          <input id="login-password" type="password" placeholder="••••••••">
        </div>
        <div class="forgot">Forgot password?</div>
        <button class="btn-primary" id="btn-login" onclick="doLogin()">Sign in</button>
        <div class="divider">or</div>
        <button class="btn-ghost" onclick="switchTab('register')">Create a new account</button>
      </div>

      <div id="panel-register" class="panel">
        <div class="field">
          <label>Email address</label>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#8899a6" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,12 2,6"/></svg>
          <input id="reg-email" type="email" placeholder="you@example.com">
        </div>
        <div class="field">
          <label>Password</label>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#8899a6" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          <input id="reg-password" type="password" placeholder="Min. 8 characters" oninput="checkStrength(this.value)">
          <div class="strength-bar">
            <div class="strength-seg" id="s1"></div>
            <div class="strength-seg" id="s2"></div>
            <div class="strength-seg" id="s3"></div>
            <div class="strength-seg" id="s4"></div>
          </div>
        </div>
        <div class="field">
          <label>Confirm password</label>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#8899a6" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          <input id="reg-confirm" type="password" placeholder="Re-enter password">
        </div>
        <button class="btn-primary" id="btn-register" onclick="doRegister()">Create account</button>
        <div class="divider">already a member?</div>
        <button class="btn-ghost" onclick="switchTab('login')">Sign in instead</button>
      </div>

      <p class="footer-note">By signing up you agree to our <a href="#">Terms</a> &amp; <a href="#">Privacy Policy</a></p>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBIXN7CLZeZ2hcMnT3-DE-KmUBMAciQxC4",
  authDomain: "a2-3211471.firebaseapp.com",
  projectId: "a2-3211471"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(() => { t.className = 'toast'; }, 3500);
}

function setLoading(btnId, loading, label) {
  const btn = document.getElementById(btnId);
  btn.disabled = loading;
  btn.textContent = loading ? 'Please wait…' : label;
}

window.doLogin = async () => {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  if (!email || !password) { showToast('Please fill in all fields.', 'error'); return; }
  setLoading('btn-login', true, 'Sign in');
  try {
    const cred = await signInWithEmailAndPassword(auth, email, password);
    localStorage.setItem('uid', cred.user.uid);
    showToast('Signed in! Redirecting…', 'success');
    const res = await fetch(`/check-user/${cred.user.uid}`);
    const data = await res.json();
    setTimeout(() => { window.location = data.exists ? '/feed' : '/username'; }, 1200);
  } catch (e) {
    const msg = e.code === 'auth/invalid-credential' ? 'Invalid email or password.'
      : e.code === 'auth/user-not-found' ? 'No account found with this email.'
      : e.code === 'auth/wrong-password' ? 'Incorrect password.'
      : e.message;
    showToast(msg, 'error');
  } finally {
    setLoading('btn-login', false, 'Sign in');
  }
};

window.doRegister = async () => {
  const email = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  const confirm = document.getElementById('reg-confirm').value;
  if (!email || !password || !confirm) { showToast('Please fill in all fields.', 'error'); return; }
  if (password.length < 8) { showToast('Password must be at least 8 characters.', 'error'); return; }
  if (password !== confirm) { showToast('Passwords do not match.', 'error'); return; }
  setLoading('btn-register', true, 'Create account');
  try {
    await createUserWithEmailAndPassword(auth, email, password);
    showToast('Account created! You can now sign in.', 'success');
    setTimeout(() => switchTab('login'), 1500);
  } catch (e) {
    const msg = e.code === 'auth/email-already-in-use' ? 'This email is already registered.'
      : e.code === 'auth/invalid-email' ? 'Please enter a valid email address.'
      : e.code === 'auth/weak-password' ? 'Password is too weak. Try a stronger one.'
      : e.message;
    showToast(msg, 'error');
  } finally {
    setLoading('btn-register', false, 'Create account');
  }
};
</script>

<script>
function switchTab(tab) {
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-register').classList.toggle('active', tab === 'register');
  document.getElementById('panel-login').classList.toggle('active', tab === 'login');
  document.getElementById('panel-register').classList.toggle('active', tab === 'register');
}
function checkStrength(val) {
  const colors = ['#e24b4a','#ef9f27','#1da1f2','#1d9e75'];
  let score = 0;
  if (val.length >= 8) score++;
  if (/[A-Z]/.test(val)) score++;
  if (/[0-9]/.test(val)) score++;
  if (/[^A-Za-z0-9]/.test(val)) score++;
  for (let i = 1; i <= 4; i++) {
    document.getElementById('s' + i).style.background = i <= score ? colors[score - 1] : '#253341';
  }
}
</script>
