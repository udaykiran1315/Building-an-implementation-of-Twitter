<!DOCTYPE html>
<html>
<head>
<title>Set Username</title>
<style>
body {
  background:#15202b;
  color:white;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.card {
  background:#192734;
  padding:30px;
  border-radius:10px;
  width:300px;
  text-align:center;
}
input {
  width:100%;
  padding:10px;
  margin-top:15px;
  border:none;
  border-radius:6px;
}
button {
  margin-top:15px;
  padding:10px;
  width:100%;
  background:#1da1f2;
  border:none;
  color:white;
  border-radius:6px;
}
.error {
  color:red;
  margin-top:10px;
}
</style>
</head>

<body>
<div class="card">
  <h2>Choose Username</h2>

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  <form method="post" action="/set-username">
    <input type="hidden" name="firebase_uid" id="uid">
    <input name="username" placeholder="Username" required>
    <button type="submit">Save</button>
  </form>
</div>

<script>
document.getElementById("uid").value = localStorage.getItem("uid");
</script>
</body>
</html>
