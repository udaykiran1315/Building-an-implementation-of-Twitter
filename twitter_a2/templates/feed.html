<!DOCTYPE html>
<html>
<head>
<title>Home</title>
<style>
body {
  margin:0;
  background:#15202b;
  color:white;
  font-family:Arial;
}

.nav {
  background:#192734;
  padding:15px;
  display:flex;
  justify-content:space-between;
}
.nav h2 { color:#1da1f2; }

.container {
  width:500px;
  margin:20px auto;
}

.tweet-box {
  background:#192734;
  padding:15px;
  border-radius:10px;
}

textarea {
  width:100%;
  height:80px;
  padding:10px;
  border:none;
  border-radius:8px;
}

button {
  margin-top:10px;
  padding:10px;
  background:#1da1f2;
  border:none;
  color:white;
  border-radius:6px;
}

.tweet {
  background:#192734;
  padding:15px;
  margin-top:15px;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="nav">
  <h2>Twitter</h2>
  <button onclick="logout()">Logout</button>
</div>

<div class="container">

  <div class="tweet-box">
    <textarea id="content" maxlength="280" placeholder="What's happening?"></textarea>
    <button onclick="tweet()">Tweet</button>
  </div>

</div>

<script>
async function tweet() {
  const content = document.getElementById("content").value;
  const uid = localStorage.getItem("uid");

  if (!content) {
    alert("Write something!");
    return;
  }

  const form = new FormData();
  form.append("user_id", uid);
  form.append("content", content);

  await fetch("/tweet", {
    method: "POST",
    body: form
  });

  alert("Tweet posted!");
  location.reload();
}

function logout() {
  localStorage.removeItem("uid");
  window.location = "/";
}
</script>

</body>
</html>
