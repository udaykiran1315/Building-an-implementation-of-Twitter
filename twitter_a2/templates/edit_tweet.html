<!DOCTYPE html>
<html>
<head>
<style>
body {
  margin:0;
  background:#15202b;
  color:white;
  font-family:Arial;
}

.container {
  width:420px;
  margin:50px auto;
}

.card {
  background:#192734;
  padding:20px;
  border-radius:12px;
  box-shadow:0 0 10px rgba(0,0,0,0.4);
}

h2 {
  margin-bottom:15px;
  color:#1da1f2;
}

textarea {
  width:100%;
  height:100px;
  padding:10px;
  border-radius:8px;
  border:none;
  outline:none;
  background:#22303c;
  color:white;
  resize:none;
}

textarea::placeholder {
  color:#8899a6;
}

img {
  width:100%;
  margin-top:12px;
  border-radius:10px;
}

.file-input {
  margin-top:12px;
  color:white;
}

button {
  margin-top:15px;
  width:100%;
  padding:12px;
  background:#1da1f2;
  border:none;
  color:white;
  border-radius:25px;
  cursor:pointer;
  font-weight:bold;
  transition:0.2s;
}

button:hover {
  background:#1991da;
}
</style>
</head>

<body>

<div class="container">

  <div class="card">
    <h2>Edit Tweet</h2>

    <form action="/edit-tweet-image" method="post" enctype="multipart/form-data">
      <input type="hidden" name="tweet_id" value="{{ tweet._id }}">

      <textarea name="content" placeholder="Update your tweet...">{{ tweet.content }}</textarea>

      {% if tweet.image %}
      <img src="{{ tweet.image }}">
      {% endif %}

      <input type="file" name="file" class="file-input">

      <button>Update Tweet</button>
    </form>
  </div>

</div>

</body>
</html>
